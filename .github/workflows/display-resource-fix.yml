name: Build Pi5 display-resource UEFI candidate

on:
  push:
    branches:
      - display/socb-resource-fix
    paths:
      - 'build-display-resource-fix.sh'
      - 'temporary-patches/edk2-platforms/0006-RPi5-narrow-SOCB-resource-window-for-GPU.patch'
      - 'tests/display_resource_test.py'
      - 'docs/DISPLAY-RESOURCE-exp0.6.md'
      - '.github/workflows/display-resource-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: display-resource-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_COMMIT: 838d87df37fe1b27c75a674fca64c1fa067413e3
  BASELINE_EDK2_PLATFORMS: c4b5d05de1f2ef633bdb4c175b5c118fcb2666ed
  RPI_FIRMWARE_URL: https://github.com/raspberrypi/firmware
  DTB_VERSION: 1e403e23baab5673f0494a200f57cd01287d5b1a
  D0_OVERLAY_VERSION: bead686816848038563a542dc854346ab13253a2

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RELEASE
            debug: '0'
          - name: DEBUG
            debug: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Prove change isolation and frozen working baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          while IFS= read -r path; do
            case "$path" in
              build-display-resource-fix.sh|\
              temporary-patches/edk2-platforms/0006-RPi5-narrow-SOCB-resource-window-for-GPU.patch|\
              tests/display_resource_test.py|\
              docs/DISPLAY-RESOURCE-exp0.6.md|\
              .github/workflows/display-resource-fix.yml)
                ;;
              *) echo "Unexpected candidate change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASELINE_COMMIT"..HEAD)

          git diff --exit-code "$BASELINE_COMMIT"..HEAD -- \
            .gitmodules config.txt build.sh build-wifi-direct-sdio-ndis.sh \
            arm-trusted-firmware edk2 edk2-platforms edk2-non-osi \
            temporary-patches/edk2-platforms/0001-RPi5-add-fail-safe-fan-control-and-ACPI-interface.patch \
            temporary-patches/edk2-platforms/0002-RPi5-keep-microSD-powered-during-UEFI.patch \
            temporary-patches/edk2-platforms/0003-RPi5-Windows-fan-safe-handoff-and-mailbox-routing.patch \
            temporary-patches/edk2-platforms/0004-RPi5-WiFi-direct-SDIO-NDIS.patch \
            temporary-patches/edk2-platforms/0005-RPi5-RTC-and-settings-persistence.patch \
            tests/wifi_pinctrl_test.py tests/rtc_settings_test.py
          echo "PASS: current working firmware inputs are byte-for-byte protected."

      - name: Initialize exact pinned firmware submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 arm-trusted-firmware edk2 edk2-platforms edk2-non-osi
          test "$(git -C arm-trusted-firmware rev-parse HEAD)" = a5c580fd539929af41cf483b7c1434db261dd51b
          test "$(git -C edk2 rev-parse HEAD)" = 7bbf1f2022f381f48cfb5411df9e5157ee0291a5
          test "$(git -C edk2-platforms rev-parse HEAD)" = "$BASELINE_EDK2_PLATFORMS"
          test "$(git -C edk2-non-osi rev-parse HEAD)" = 66b41e9308a6711cd74e541366a8d9ec7a949d45

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            acpica-tools binutils-aarch64-linux-gnu build-essential device-tree-compiler \
            libfdt-dev gettext git gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            python3 python3-pyelftools uuid-dev zip

      - name: Validate final patch stack without building
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            temporary-patches/edk2-platforms/0004-RPi5-WiFi-direct-SDIO-NDIS.patch
            temporary-patches/edk2-platforms/0005-RPi5-RTC-and-settings-persistence.patch
            temporary-patches/edk2-platforms/0006-RPi5-narrow-SOCB-resource-window-for-GPU.patch
            temporary-patches/edk2-platforms/0001-RPi5-add-fail-safe-fan-control-and-ACPI-interface.patch
            temporary-patches/edk2-platforms/0002-RPi5-keep-microSD-powered-during-UEFI.patch
            temporary-patches/edk2-platforms/0003-RPi5-Windows-fan-safe-handoff-and-mailbox-routing.patch
          )
          for p in "${patches[@]}"; do
            git -C edk2-platforms apply --check "${GITHUB_WORKSPACE}/$p"
            git -C edk2-platforms apply "${GITHUB_WORKSPACE}/$p"
          done
          python3 tests/display_resource_test.py edk2-platforms | tee DISPLAY_RESOURCE_TESTS.log
          for ((i=${#patches[@]}-1; i>=0; i--)); do
            git -C edk2-platforms apply --reverse "${GITHUB_WORKSPACE}/${patches[$i]}"
          done
          git -C edk2-platforms diff --exit-code

      - name: Re-run direct-SDIO pinctrl regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p overlays
          curl --fail --location --retry 3 -o bcm2712-rpi-5-b.dtb "$RPI_FIRMWARE_URL/raw/$DTB_VERSION/boot/bcm2712-rpi-5-b.dtb"
          curl --fail --location --retry 3 -o overlays/bcm2712d0.dtbo "$RPI_FIRMWARE_URL/raw/$D0_OVERLAY_VERSION/boot/overlays/bcm2712d0.dtbo"
          fdtoverlay -i bcm2712-rpi-5-b.dtb -o /tmp/wifi-d0.dtb overlays/bcm2712d0.dtbo
          p="${GITHUB_WORKSPACE}/temporary-patches/edk2-platforms/0004-RPi5-WiFi-direct-SDIO-NDIS.patch"
          git -C edk2-platforms apply "$p"
          python3 tests/wifi_pinctrl_test.py \
            edk2-platforms/Platform/RaspberryPi/RPi5/Drivers/RpiPlatformDxe/Peripherals.c \
            bcm2712-rpi-5-b.dtb /tmp/wifi-d0.dtb
          git -C edk2-platforms apply --reverse "$p"
          git -C edk2-platforms diff --exit-code

      - name: Re-run RTC/settings fault-injection regression
        shell: bash
        run: |
          set -euo pipefail
          p="${GITHUB_WORKSPACE}/temporary-patches/edk2-platforms/0005-RPi5-RTC-and-settings-persistence.patch"
          git -C edk2-platforms apply "$p"
          python3 tests/rtc_settings_test.py | tee RTC_SETTINGS_TESTS.log
          git -C edk2-platforms apply --reverse "$p"
          git -C edk2-platforms diff --exit-code

      - name: Build ${{ matrix.name }} candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-display-resource-fix.sh
          ./build-display-resource-fix.sh --model 5 --debug "${{ matrix.debug }}" 2>&1 | tee DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log
          test -f RPI_EFI.fd
          git -C edk2-platforms diff --exit-code
          grep -Fq 'Applied experimental RPi5 fail-safe fan patch' DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log
          grep -Fq 'Applied RPi5 microSD UEFI power patch' DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log
          grep -Fq 'Applied RPi5 Windows fan safe-handoff and mailbox-routing patch' DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log
          grep -Fq 'Applied direct-SDIO Wi-Fi patch' DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log
          grep -Fq 'Applied RTC/settings persistence patch' DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log
          grep -Fq 'Applied SOCB/GPU resource-scope patch' DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log

      - name: Validate emitted firmware and ACPI artifact
        shell: bash
        run: |
          set -euo pipefail
          settings="${GITHUB_WORKSPACE}/temporary-patches/edk2-platforms/0005-RPi5-RTC-and-settings-persistence.patch"
          git -C edk2-platforms apply "$settings"
          python3 tests/rtc_settings_test.py --firmware RPI_EFI.fd | tee -a RTC_SETTINGS_TESTS.log
          git -C edk2-platforms apply --reverse "$settings"

          aml="$(find Build/RPi5 -type f -iname 'Dsdt.aml' -print -quit)"
          test -n "$aml"
          iasl -d -p /tmp/RPi5DisplayCandidate "$aml"
          test -f /tmp/RPi5DisplayCandidate.dsl
          ! grep -Fqi '0x000000107C000000' /tmp/RPi5DisplayCandidate.dsl
          grep -Fqi '0x000000107D001000' /tmp/RPi5DisplayCandidate.dsl
          grep -Fqi '0x000000107C013880' /tmp/RPi5DisplayCandidate.dsl
          cp /tmp/RPi5DisplayCandidate.dsl DSDT_DISPLAY_RESOURCE_${{ matrix.name }}.dsl

      - name: Package ${{ matrix.name }} candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'candidate_commit %s\n' "$(git rev-parse HEAD)"
            printf 'baseline_master %s\n' "$BASELINE_COMMIT"
            for module in arm-trusted-firmware edk2 edk2-non-osi edk2-platforms; do
              printf '%s %s\n' "$module" "$(git -C "$module" rev-parse HEAD)"
            done
          } > SOURCE_REVISIONS.txt
          cat > DISPLAY_RESOURCE_README.txt <<'EOF'
          Raspberry Pi 5 UEFI display-resource candidate exp0.6
          ====================================================
          Baseline: farjanatech/rpi5-uefi 838d87d.
          Existing fan/temp, direct-SDIO Wi-Fi, RTC/settings, SD, PCIe/NVMe,
          USB and HDMI configuration are intentionally unchanged.
          The only functional experiment narrows SOCB ACPI producer MMIO from
          the full legacy aperture to the exact PL011 and TMP0 child windows.
          This is intended to test Windows GPU Code 12 / conflicting-address
          behavior. CI success is not hardware validation.
          Keep a known-good boot medium/firmware available before testing.
          EOF
          sha256sum RPI_EFI.fd config.txt SOURCE_REVISIONS.txt DISPLAY_RESOURCE_README.txt \
            DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log DISPLAY_RESOURCE_TESTS.log \
            RTC_SETTINGS_TESTS.log DSDT_DISPLAY_RESOURCE_${{ matrix.name }}.dsl \
            > SHA256SUMS_DISPLAY_RESOURCE_${{ matrix.name }}.txt
          mkdir package
          cp RPI_EFI.fd config.txt SOURCE_REVISIONS.txt DISPLAY_RESOURCE_README.txt \
            DISPLAY_RESOURCE_BUILD_${{ matrix.name }}.log DISPLAY_RESOURCE_TESTS.log \
            RTC_SETTINGS_TESTS.log DSDT_DISPLAY_RESOURCE_${{ matrix.name }}.dsl \
            SHA256SUMS_DISPLAY_RESOURCE_${{ matrix.name }}.txt package/
          cp bcm2712-rpi-5-b.dtb package/
          cp -r overlays package/
          (cd package && zip -q -r ../RPi5_UEFI_DisplayResource_exp0.6_${{ matrix.name }}.zip .)
          sha256sum RPi5_UEFI_DisplayResource_exp0.6_${{ matrix.name }}.zip

      - name: Upload ${{ matrix.name }} candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RPi5_UEFI_DisplayResource_exp0.6_${{ matrix.name }}
          path: RPi5_UEFI_DisplayResource_exp0.6_${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30
