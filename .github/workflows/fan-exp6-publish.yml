name: Publish fan exp.6 combo

on:
  pull_request:
    branches:
      - fan-persistent-windows-driver-exp5b
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  actions: read

env:
  VERIFIED_RUN: 32164627975
  FUNCTIONAL_COMMIT: 302969fc9b61f6f1d099d24c46d27a1a0dca936e
  RELEASE_TARGET: 84bbe074ac7c41e89e2d17d2adacf650314bd655
  DRIVER_VERSION: 2026.8.18.6

jobs:
  publish:
    if: ${{ contains(github.event.pull_request.title, '[fan-exp6]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download verified combo artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: RPi5FanControl_combo_exp6
          path: recovered-combo
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}

      - name: Download verified driver artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: RPi5Fan_Drivers_ARM64_exp6
          path: recovered-drivers
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}

      - name: Verify recovered exp.6 artifacts
        shell: bash
        run: |
          set -euxo pipefail
          tr -d '\r' < recovered-combo/PROVENANCE_exp6.txt > recovered-combo/PROVENANCE_exp6.normalized.txt
          tr -d '\r' < recovered-combo/SHA256SUMS_exp6.txt > recovered-combo/SHA256SUMS_exp6.normalized.txt
          grep -Fxq "functional_commit=${FUNCTIONAL_COMMIT}" recovered-combo/PROVENANCE_exp6.normalized.txt
          grep -Fxq "driver_version=${DRIVER_VERSION}" recovered-combo/PROVENANCE_exp6.normalized.txt
          expected="$(awk '$2 == "RPi5FanControl_ARM64_exp6.zip" {print $1}' recovered-combo/SHA256SUMS_exp6.normalized.txt)"
          actual="$(sha256sum recovered-combo/RPi5FanControl_ARM64_exp6.zip | awk '{print $1}')"
          test -n "${expected}"
          test "${expected}" = "${actual}"

          rm -rf verify-combo
          mkdir verify-combo
          unzip -q recovered-combo/RPi5FanControl_ARM64_exp6.zip -d verify-combo
          for file in \
            Drivers/Rpi5Temp/Rpi5Temp.inf \
            Drivers/Rpi5Temp/Rpi5Temp.sys \
            Drivers/Rpi5Temp/rpi5temp.cat \
            Drivers/Rpi5Temp/Rpi5Temp.cer \
            Drivers/Rpi5Fan/Rpi5Fan.inf \
            Drivers/Rpi5Fan/Rpi5Fan.sys \
            Drivers/Rpi5Fan/rpi5fan.cat \
            Drivers/Rpi5Fan/Rpi5Fan.cer \
            GUI/Rpi5FanControl.exe \
            Install.cmd \
            Install-RPi5FanSuite.ps1 \
            README.md; do
            test -f "verify-combo/${file}"
          done
          grep -Eq 'DriverVer[[:space:]]*=[[:space:]]*08/18/2026,2026\.8\.18\.6' verify-combo/Drivers/Rpi5Temp/Rpi5Temp.inf
          grep -Eq 'DriverVer[[:space:]]*=[[:space:]]*08/18/2026,2026\.8\.18\.6' verify-combo/Drivers/Rpi5Fan/Rpi5Fan.inf
          grep -Fq 'ACPI\RPI0010' verify-combo/Drivers/Rpi5Temp/Rpi5Temp.inf
          grep -Fq 'ACPI\RPI000F' verify-combo/Drivers/Rpi5Fan/Rpi5Fan.inf

      - name: Prepare standalone driver ZIP and matching validated UEFI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-files/driver-stage
          cp -a recovered-drivers/. release-files/driver-stage/
          (cd release-files/driver-stage && zip -q -r ../RPi5Fan_Drivers_ARM64_exp6.zip .)
          rm -rf release-files/driver-stage

          cp recovered-combo/RPi5FanControl_ARM64_exp6.zip release-files/
          cp recovered-combo/PROVENANCE_exp6.normalized.txt release-files/PROVENANCE_exp6.txt

          # exp.6 intentionally keeps the physically validated exp.5B ACPI/UEFI
          # layout byte-for-byte. Re-ship that exact UEFI asset for convenience.
          curl --fail --location --retry 3 \
            -o release-files/RPi5_UEFI_Release_exp5b.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/rpi5fan-v0.1.1-exp.5b/RPi5_UEFI_Release_exp5b.zip"

          cat > release-files/INSTALL_EXP6_FIRST.txt <<'EOF'
          Raspberry Pi 5 Fan Control exp.6

          Required firmware layout:
          - FAN0: ACPI\RPI000F with four RP1 fan resources only
          - TMP0: ACPI\RPI0010 with BCM2712 mailbox only
          - No Code 12 on either device

          The included RPi5_UEFI_Release_exp5b.zip is the same split-resource
          UEFI layout already physically validated before exp.6. If that exact
          exp.5B UEFI is already installed and both devices are Code-12-free,
          you do not need to flash it again.

          Recommended Windows install:
          1. Extract RPi5FanControl_ARM64_exp6.zip completely.
          2. Run Install.cmd as Administrator.
          3. If test-signing is enabled by the installer, reboot and run
             Install.cmd again.
          4. Installer loads Rpi5Temp first, then Rpi5Fan, and requires both
             ACPI devices to reach Code 0 with version 2026.8.18.6.
          5. Launch Raspberry Pi 5 Fan Control from the Desktop shortcut.

          Safety:
          - Fan driver enters D0 at 100%.
          - Missing/invalid temperature provider forces 100%.
          - Temperature >=85 C forces 100%.
          - Manual control is 30-100% only.
          - Normal D0 exit/release requests 100%.
          - An arbitrary hard kernel crash cannot execute cleanup; hardware may
            retain the last commanded non-zero 30-100% PWM value.
          EOF

          (cd release-files && sha256sum \
            RPi5FanControl_ARM64_exp6.zip \
            RPi5Fan_Drivers_ARM64_exp6.zip \
            RPi5_UEFI_Release_exp5b.zip \
            INSTALL_EXP6_FIRST.txt \
            PROVENANCE_exp6.txt \
            > SHA256SUMS_exp6.txt)
          cat release-files/SHA256SUMS_exp6.txt

      - name: Write exp.6 release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Raspberry Pi 5 Fan Control - experimental 6

          First combined Windows 11 ARM64 **split-driver + GUI** package for the physically validated exp.5B ACPI ownership layout.

          ### What changed
          - `Rpi5Temp.sys` binds `ACPI\\RPI0010` and exclusively owns the BCM2712 property-mailbox range.
          - `Rpi5Fan.sys` binds `ACPI\\RPI000F` and exclusively owns the four RP1 fan-control resources.
          - The fan driver queries the temperature provider with a bounded KMDF synchronous request; missing, failed, invalid, or stale telemetry keeps the fan at the 100% fail-safe command.
          - Fan API v2 exposes temperature-provider health to the GUI.
          - Self-contained Windows ARM64 GUI shows SoC temperature, commanded PWM %, control mode, provider status, fail-safe/over-temperature state, and CSV logs.
          - Combined `Install.cmd` installs the temperature provider first, then the fan driver, and verifies both devices reach Code 0 with DriverVer `2026.8.18.6`.

          ### Safety policy
          UEFI hands Windows a 100% fan state. Fan D0 entry starts at 100%. Temperature provider unavailable/invalid, temperature read failure, or temperature >=85 C forces 100%. Manual control is restricted to 30-100%. Normal D0 exit and hardware release request 100%. There is no 0% control API.

          An arbitrary hard kernel crash after a lower PWM command cannot execute cleanup; the RP1 PWM hardware may retain the last commanded non-zero 30-100% value. A separate independent watchdog would be needed to guarantee automatic 100% after an arbitrary crash.

          ### Hardware validation status
          Before this driver release, physical exp.5B testing confirmed that splitting FAN0 and TMP0 eliminates Code 12: `ACPI\\RPI000F\\0` receives four RP1 resources and `ACPI\\RPI0010\\0` receives only `0x107C013880-0x107C0138BF`, with no Code-12 devices reported. exp.6 now needs supervised physical validation of both drivers reaching Code 0, live temperature telemetry, and PWM control.

          Recommended download: **RPi5FanControl_ARM64_exp6.zip**.
          EOF

      - name: Publish exp.6 prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: rpi5fan-v0.1.1-exp.6
          target_commitish: ${{ env.RELEASE_TARGET }}
          name: RPi5 Fan Control v0.1.1 experimental 6
          body_path: release-notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
          make_latest: false
          files: release-files/*
          fail_on_unmatched_files: true
