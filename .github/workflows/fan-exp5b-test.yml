name: Fan exp.5B SOCB mailbox isolation

on:
  pull_request:
    branches:
      - fan-persistent-windows-driver-exp5b
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  actions: read

env:
  EXP5B_SOURCE: 6d8607979eaa2789db95758f8618bfe14fa72ebf
  EXP5B_RELEASE_TARGET: bd03a79307518b15c48c49663758e3e84b4a9b00
  RPI_FIRMWARE_URL: https://github.com/raspberrypi/firmware/
  DTB_VERSION: 1e403e23baab5673f0494a200f57cd01287d5b1a

jobs:
  validate-acpi-split:
    if: ${{ contains(github.event.pull_request.title, '[fan-exp5b-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned exp.5B functional source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.EXP5B_SOURCE }}
          fetch-depth: 1
          submodules: false

      - name: Initialize only edk2-platforms
        shell: bash
        run: |
          set -euxo pipefail
          git submodule sync -- edk2-platforms
          git submodule update --init --depth 1 --jobs 2 edk2-platforms
          git -C edk2-platforms rev-parse HEAD

      - name: Apply patches and verify FAN0/TMP0 resource ownership
        shell: bash
        run: |
          set -euxo pipefail

          patch1='temporary-patches/edk2-platforms/0001-RPi5-add-fail-safe-fan-control-and-ACPI-interface.patch'
          patch2='temporary-patches/edk2-platforms/0002-RPi5-keep-microSD-powered-during-UEFI.patch'
          patch3='temporary-patches/edk2-platforms/0003-RPi5-Windows-fan-safe-handoff-and-mailbox-routing.patch'

          git -C edk2-platforms apply --ignore-space-change --check "../${patch1}"
          git -C edk2-platforms apply --ignore-space-change "../${patch1}"
          git -C edk2-platforms apply --check "../${patch2}"
          git -C edk2-platforms apply "../${patch2}"
          git -C edk2-platforms apply --check "../${patch3}"
          git -C edk2-platforms apply "../${patch3}"

          rp1='edk2-platforms/Silicon/RaspberryPi/RpiSiliconPkg/Include/Rp1.asi'
          dsdt='edk2-platforms/Platform/RaspberryPi/RPi5/AcpiTables/Dsdt.asl'
          fanctl='edk2-platforms/Platform/RaspberryPi/RPi5/Drivers/RpiPlatformDxe/FanControl.c'

          awk '/Device \(FAN0\)/ {capture=1; count=0} capture {print; count++} capture && count >= 70 {exit}' "${rp1}" > /tmp/fan0.txt
          awk '/Device \(SOCB\)/ {capture=1} capture {print} /} \/\/ Device \(SOCB\)/ {exit}' "${dsdt}" > /tmp/socb.txt

          echo '--- FAN0 ---'
          cat /tmp/fan0.txt
          echo '--- SOCB ---'
          cat /tmp/socb.txt

          test "$(grep -c 'RP1_QWORDMEMORY_BUF' /tmp/fan0.txt)" -eq 4
          grep -Fq 'RP1_QWORDMEMORY_SET (00, RP1_CLOCKS_MAIN_BASE, 0x1000)' /tmp/fan0.txt
          grep -Fq 'RP1_QWORDMEMORY_SET (01, RP1_PWM1_BASE, 0x1000)' /tmp/fan0.txt
          grep -Fq 'RP1_QWORDMEMORY_SET (02, RP1_IO_BANK2_BASE, 0x1000)' /tmp/fan0.txt
          grep -Fq 'RP1_QWORDMEMORY_SET (03, RP1_PADS_BANK2_BASE, 0x1000)' /tmp/fan0.txt
          if grep -Fq '107C013880' /tmp/fan0.txt; then
            echo 'BCM2712 mailbox leaked back into FAN0.' >&2
            exit 1
          fi
          if grep -Fq '\_SB.SOCB' /tmp/fan0.txt; then
            echo 'Cross-bus SOCB ResourceSource leaked back into FAN0.' >&2
            exit 1
          fi

          grep -Fq 'Device (TMP0)' /tmp/socb.txt
          grep -Fq 'Name (_HID, "RPI0010")' /tmp/socb.txt
          test "$(grep -c 'QWORD_SET (00, 0x000000107C013880, 0x40, 0)' /tmp/socb.txt)" -eq 1
          grep -Fq 'QWORDMEMORY_BUF (00, ResourceConsumer)' /tmp/socb.txt
          grep -Fq 'raspberrypi,rpi5-property-mailbox-temperature' /tmp/socb.txt
          grep -Fq '(VOID)mRp1Bus->SetFanSpeed (mRp1Bus, FAN_FAIL_SAFE_SPEED);' "${fanctl}"

          echo 'exp.5B ACPI split verified: FAN0=4 RP1 resources; TMP0=SOCB mailbox; 100% handoff retained.'

  build-uefi:
    if: ${{ contains(github.event.pull_request.title, '[fan-exp5b-test]') }}
    needs: validate-acpi-split
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        CONFIGURATION: [Debug, Release]
    steps:
      - name: Checkout pinned exp.5B functional source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.EXP5B_SOURCE }}
          fetch-depth: 1
          submodules: false

      - name: Initialize required firmware submodules
        shell: bash
        run: |
          set -euxo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 \
            arm-trusted-firmware edk2 edk2-platforms edk2-non-osi
          for module in arm-trusted-firmware edk2 edk2-platforms edk2-non-osi; do
            git -C "${module}" rev-parse HEAD
          done

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            acpica-tools \
            binutils-aarch64-linux-gnu \
            build-essential \
            device-tree-compiler \
            gettext \
            git \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            python3 \
            python3-pyelftools \
            uuid-dev

      - name: Build pinned Raspberry Pi 5 UEFI
        shell: bash
        run: |
          set -euxo pipefail
          export EDK2_BUILD_FLAGS="--pcd gEfiMdeModulePkgTokenSpaceGuid.PcdFirmwareVendor=L${{ github.repository_owner }}"
          ./build.sh \
            --model 5 \
            --debug ${{ matrix.CONFIGURATION == 'Debug' && 1 || 0 }} \
            --edk2-flags "${EDK2_BUILD_FLAGS}"

      - name: Add Raspberry Pi support file and provenance
        shell: bash
        run: |
          set -euxo pipefail
          curl -O -L "${RPI_FIRMWARE_URL}/raw/${DTB_VERSION}/boot/bcm2712-rpi-5-b.dtb"
          {
            printf 'rpi5-uefi %s\n' "$(git rev-parse HEAD)"
            for module in arm-trusted-firmware edk2 edk2-non-osi edk2-platforms; do
              printf '%s %s\n' "${module}" "$(git -C "${module}" rev-parse HEAD)"
            done
          } > SOURCE_REVISIONS.txt
          grep -Fxq "rpi5-uefi ${EXP5B_SOURCE}" SOURCE_REVISIONS.txt
          sha256sum RPI_EFI.fd config.txt *.dtb > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload exp.5B UEFI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RPi5_UEFI_${{ matrix.CONFIGURATION }}_exp5b_6d86079
          path: |
            RPI_EFI.fd
            config.txt
            *.dtb
            SOURCE_REVISIONS.txt
            SHA256SUMS
            THIRD_PARTY_NOTICES.md
            LICENSES/Soulveig-BSD-2-Clause-Patent.txt
          if-no-files-found: error

  publish-exp5b:
    if: ${{ contains(github.event.pull_request.title, '[fan-exp5b-test]') }}
    needs:
      - validate-acpi-split
      - build-uefi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified Release UEFI
        uses: actions/download-artifact@v8.0.1
        with:
          name: RPi5_UEFI_Release_exp5b_6d86079
          path: release-stage/uefi

      - name: Verify and package exp.5B test release
        shell: bash
        run: |
          set -euxo pipefail
          test -f release-stage/uefi/RPI_EFI.fd
          test -f release-stage/uefi/SOURCE_REVISIONS.txt
          test -f release-stage/uefi/SHA256SUMS
          grep -Fxq "rpi5-uefi ${EXP5B_SOURCE}" release-stage/uefi/SOURCE_REVISIONS.txt
          (cd release-stage/uefi && sha256sum -c SHA256SUMS)

          mkdir -p release-files
          (cd release-stage/uefi && zip -q -r ../../release-files/RPi5_UEFI_Release_exp5b.zip .)

          cat > release-files/TEST_EXP5B_FIRST.txt <<'EOF'
          Raspberry Pi 5 fan exp.5B is a UEFI-only ACPI ownership test.

          Keep all RPi5Fan Windows driver packages removed. Do NOT install the
          exp.4/exp.4.1 driver for this test.

          FAN0 (ACPI\RPI000F\0) must retain exactly four RP1 resources and must
          not report Code 12.

          TMP0 (expected ACPI\RPI0010\0) is a new child under the BCM2712 SOCB
          producer. It must own exactly one mailbox resource:
            0x000000107C013880-0x000000107C0138BF

          The key result is that TMP0 must NOT report Code 12. With no driver it
          may appear Stopped/Unknown and may or may not carry a missing-driver
          problem code depending on Windows' devnode state.

          The physical fan must remain running continuously from the UEFI 100%
          ExitBootServices handoff.
          EOF

          cat > release-files/PROVENANCE_exp5b.txt <<EOF
          Functional source commit: ${EXP5B_SOURCE}
          Workflow-clean release tag target: ${EXP5B_RELEASE_TARGET}
          FAN0: four RP1 resources only.
          TMP0: RPI0010 child under SOCB with 0x107C013880-0x107C0138BF.
          UEFI Windows handoff: forced 100% fan retained.
          Windows fan/temperature driver: intentionally NOT part of this release.
          EOF

          (cd release-files && sha256sum \
            RPi5_UEFI_Release_exp5b.zip \
            TEST_EXP5B_FIRST.txt \
            PROVENANCE_exp5b.txt \
            > SHA256SUMS_exp5b.txt)

      - name: Write exp.5B release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Raspberry Pi 5 Active Cooler - experimental 5B

          **UEFI-only ACPI ownership test. Do not install a Windows fan driver yet.**

          exp.5A hardware testing removed the fifth BCM2712 mailbox range from `ACPI\\RPI000F\\0`. Windows then assigned the four RP1 fan resources and no longer reported Code 12 on FAN0.

          exp.5B keeps that proven four-resource FAN0 unchanged and adds a new `RPI0010` / `TMP0` child underneath the BCM2712 `SOCB` resource producer. TMP0 consumes only the property-mailbox MMIO range `0x107C013880-0x107C0138BF`, following the same parent/child resource model already used by other SOCB children.

          ### Test objective
          Keep all RPi5Fan Windows driver packages removed. Boot this UEFI and verify:

          - `ACPI\\RPI000F\\0` still has exactly four RP1 ranges and no Code 12.
          - `ACPI\\RPI0010\\0` exists and owns exactly `0x107C013880-0x107C0138BF`.
          - `RPI0010` does **not** report Code 12.
          - The physical fan continues running from the UEFI 100% fail-safe handoff.

          A successful result will clear the way for the Windows driver to treat FAN0 and the temperature mailbox as two independently owned PnP devices instead of mixing RP1 and BCM2712 resources on one devnode.
          EOF

      - name: Publish exp.5B prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: rpi5fan-v0.1.1-exp.5b
          target_commitish: ${{ env.EXP5B_RELEASE_TARGET }}
          name: RPi5 Fan Driver v0.1.1 experimental 5B (SOCB mailbox test)
          body_path: release-notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
          make_latest: false
          files: release-files/*
          fail_on_unmatched_files: true
