name: Publish fan exp.4 verified release

on:
  push:
    branches:
      - fan-persistent-windows-driver-exp4

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[release-fan]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified driver release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: RPi5Fan_release_exp4
          path: release-stage/driver
          run-id: 32033014574
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified Windows ARM64 GUI
        uses: actions/download-artifact@v8.0.1
        with:
          name: RPi5Fan_GUI_ARM64_exp4
          path: release-stage/gui
          run-id: 32033014574
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified matching UEFI Release build
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: RPi5_UEFI_Release_*
          path: release-stage/uefi
          merge-multiple: true
          run-id: 32033014574
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package verified release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          cp release-stage/driver/Install_RPi5Fan_OneShot.cmd release-files/
          cp release-stage/driver/RPi5Fan_ARM64_exp4.zip release-files/

          (
            cd release-stage/gui
            zip -q -r ../../release-files/RPi5FanControl_ARM64_exp4.zip .
          )

          (
            cd release-stage/uefi
            zip -q -r ../../release-files/RPi5_UEFI_Release_exp4.zip .
          )

          (
            cd release-files
            sha256sum \
              Install_RPi5Fan_OneShot.cmd \
              RPi5Fan_ARM64_exp4.zip \
              RPi5FanControl_ARM64_exp4.zip \
              RPi5_UEFI_Release_exp4.zip \
              > SHA256SUMS_exp4.txt
          )

          ls -lh release-files
          cat release-files/SHA256SUMS_exp4.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Raspberry Pi 5 Active Cooler Windows driver - experimental 4

          This prerelease is the matched **UEFI + Windows ARM64 driver + Windows ARM64 GUI** bundle built and validated by successful GitHub Actions run `32033014574` from source commit `62b0cb81c0758c8609c4406dcba7ca4543b85ef2`.

          ### exp.4 changes
          - Tests explicit ACPI `ResourceSource` routing of the BCM2712 property mailbox to the `SOCB` producer to address the observed Windows Code 12 resource conflict.
          - UEFI programs the fan to 100% at ExitBootServices so Windows always inherits a running fail-safe fan state.
          - Windows driver version is `2026.8.17.4`.
          - Driver API supports Automatic, Manual 30-100%, status telemetry, and Force 100%.
          - Temperature-read failure forces 100%.
          - Manual mode has an 85 C emergency override to 100%.
          - Normal D0 exit and hardware release request 100% before resources are released.
          - Windows 11 ARM64 GUI shows SoC temperature, commanded PWM percentage, mode/status, safety state, controls, and CSV logging.
          - Actual RPM is not reported until tachometer support is implemented.

          ### Assets
          - `RPi5_UEFI_Release_exp4.zip` - matching UEFI firmware containing the ACPI and 100% Windows-handoff changes.
          - `Install_RPi5Fan_OneShot.cmd` - one-shot Windows driver installer.
          - `RPi5Fan_ARM64_exp4.zip` - Windows ARM64 driver package.
          - `RPi5FanControl_ARM64_exp4.zip` - self-contained Windows 11 ARM64 GUI.
          - `SHA256SUMS_exp4.txt` - SHA-256 hashes for all four release payloads.

          ### Test order
          Install/boot the matching exp.4 UEFI first, confirm the fan is running, then install the exp.4 driver. The first hardware milestone is Device Manager showing the `ACPI\\RPI000F` fan device with **Code 0** instead of Code 12. Only after Code 0 should automatic temperature/PWM behavior and GUI controls be exercised.

          ### Safety
          This is still an experimental physical-validation release. UEFI hands Windows a 100% fan state. The driver has no 0% command and manual control is restricted to 30-100%. Keep the board supervised during the first hardware test.
          EOF

      - name: Publish exp.4 prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: rpi5fan-v0.1.1-exp.4
          target_commitish: 62b0cb81c0758c8609c4406dcba7ca4543b85ef2
          name: RPi5 Fan Driver v0.1.1 experimental 4
          body_path: release-notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
          make_latest: false
          files: release-files/*
          fail_on_unmatched_files: true
